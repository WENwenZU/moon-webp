name: ci

on: [push, pull_request, workflow_dispatch]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      # `moon fmt` follows the toolchain: a newer release rewrites `Int` to
      # `Int32` and would fail this job on code that is formatted correctly
      # for the version the project is developed with. Formatting is a local
      # convention then; the compiler still has to be warning-free here.
      - run: moon check --deny-warn

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon test
      - run: moon test --target js
      - run: moon test --target wasm
      - name: Run the examples
        run: |
          moon run examples/info
          moon run examples/preview > /dev/null
          moon run examples/frames > /dev/null
      # The README claims the same source runs on every backend; the
      # terminal preview is the cheapest proof that the JavaScript build
      # produces identical pixels rather than merely compiling.
      - name: Run an example on the JavaScript backend
        run: moon run --target js examples/preview > /dev/null

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon test --target native

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon build
      - run: moon build --target js
